plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'com.twicefear.aethelion'
version = '1.0.0'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.dmulloy2.net/repository/public/' }
    maven { url 'https://repo.codemc.io/repository/maven-public/' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
}

dependencies {
    // Paper API - supports 1.17 to 1.20.4 for Java 17 target compatibility
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Adventure for modern text
    implementation 'net.kyori:adventure-api:4.14.0'

    // ProtocolLib
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
}

shadowJar {
    relocate 'com.google.gson', 'com.twicefear.aethelion.libs.gson'
    relocate 'net.kyori', 'com.twicefear.aethelion.libs.kyori'

    // Minimize JAR size
    minimize()

    // Archive naming
    archiveFileName = 'Aethelion-' + project.version + '.jar'
}

tasks.build.dependsOn shadowJar

// Java 17+ specific settings
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}
