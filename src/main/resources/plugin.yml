name: Aethelion
version: 1.0.0
main: com.twicefear.aethelion.Aethelion
api-version: 1.17
author: Twicefear
description: Custom emote and animation library plugin with scaling support
website: https://github.com/Twicefear/Aethelion
folia-supported: true
commands:
  emote:
    description: Play emotes and manage animations
    aliases: [em, e]
    usage: /<command> <play|stop|list|scale|reload> [args]
permissions:
  emoteengine.use:
    description: Use emotes
    default: true
  emoteengine.admin:
    description: Admin commands
    default: op
